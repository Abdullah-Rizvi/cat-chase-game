<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cat Chase</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #1a1c2c;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #wrap {
    position: relative;
    width: min(96vw, calc(96vh * 4 / 3));
    aspect-ratio: 4 / 3;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
    border: 4px solid #5d275d;
    box-sizing: border-box;
    touch-action: none;
  }
  /* retro scanline effect on top of the game */
  #wrap::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);
  }
</style>
</head>
<body>

<div id="wrap">
  <canvas id="c" width="320" height="240"></canvas>
</div>

<script>
// ===== SETUP =====
var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");

var WIDTH = 320;
var HEIGHT = 240;
var TOP = 16;            // height of the score bar at the top

// ===== GAME VARIABLES =====
var gameState = "title"; // "title", "play" or "over"
var score = 0;
var timeLeft = 30;
var ballSpeed = 70;
var walkFrame = 0;       // used for the cat's walking animation
var blink = 0;           // used to blink the "press space" text
var highScore = 0;

// load the saved high score (if there is one)
try {
  highScore = Number(localStorage.getItem("catchase_hi")) || 0;
} catch (err) {
  highScore = 0;
}

var cat = { x: 150, y: 110, dir: 1 };          // dir: 1 = facing right, -1 = facing left
var ball = { x: 240, y: 70, vx: 1, vy: 0.5 };  // vx, vy = direction the ball moves
var particles = [];                            // little sparks when the cat catches the ball

// ===== INPUT =====
var keys = {};
var pointer = null;      // mouse or finger position

document.addEventListener("keydown", function (e) {
  var key = e.key.toLowerCase();
  keys[key] = true;

  // stop the page from scrolling when using arrow keys or space
  if (key === " " || key.indexOf("arrow") === 0) {
    e.preventDefault();
  }
  if (key === " " || key === "enter") {
    startGame();
  }
});

document.addEventListener("keyup", function (e) {
  keys[e.key.toLowerCase()] = false;
});

// convert a mouse/touch position into canvas coordinates
function getPointer(e) {
  var rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * WIDTH / rect.width,
    y: (e.clientY - rect.top) * HEIGHT / rect.height
  };
}

canvas.addEventListener("pointerdown", function (e) {
  pointer = getPointer(e);
  startGame();
});
canvas.addEventListener("pointermove", function (e) {
  if (pointer !== null) {
    pointer = getPointer(e);
  }
});
document.addEventListener("pointerup", function () {
  pointer = null;
});

// ===== SOUND =====
var audioCtx = null;

function playBeep(frequency, length, type) {
  try {
    if (audioCtx === null) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    var osc = audioCtx.createOscillator();
    var vol = audioCtx.createGain();
    osc.type = type || "square";
    osc.frequency.value = frequency;
    vol.gain.value = 0.05;
    osc.connect(vol);
    vol.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + length);
  } catch (err) {
    // if sound doesn't work, just ignore it
  }
}

// ===== HELPER FUNCTIONS =====
function distance(x1, y1, x2, y2) {
  return Math.sqrt((x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1));
}

// give the ball a random direction
function randomDirection() {
  var angle = Math.random() * Math.PI * 2;
  ball.vx = Math.cos(angle);
  ball.vy = Math.sin(angle);
}

// put the ball somewhere at least 90px away from the cat
function placeBall() {
  var ok = false;
  while (ok === false) {
    ball.x = 10 + Math.random() * (WIDTH - 20);
    ball.y = TOP + 10 + Math.random() * (HEIGHT - TOP - 20);
    if (distance(ball.x, ball.y, cat.x, cat.y) >= 90) {
      ok = true;
    }
  }
}

function makeSparks(x, y) {
  for (var i = 0; i < 14; i++) {
    var angle = Math.random() * Math.PI * 2;
    var speed = 30 + Math.random() * 70;
    particles.push({
      x: x,
      y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 0.5
    });
  }
}

// ===== START / RESET THE GAME =====
function startGame() {
  if (gameState === "play") {
    return; // already playing
  }
  score = 0;
  timeLeft = 30;
  ballSpeed = 70;
  particles = [];
  cat.x = 150;
  cat.y = 110;
  cat.dir = 1;
  ball.x = 250;
  ball.y = 60;
  randomDirection();
  gameState = "play";
  playBeep(440, 0.1);
}

// ===== UPDATE FUNCTIONS =====
function moveBall(dt) {
  if (gameState === "play") {
    // the ball tries to run away when the cat gets close
    var catCenterX = cat.x + 7;
    var catCenterY = cat.y + 9;
    var d = distance(ball.x, ball.y, catCenterX, catCenterY);
    if (d < 50 && d > 0) {
      ball.vx = ball.vx + (ball.x - catCenterX) / d * dt * 2.5;
      ball.vy = ball.vy + (ball.y - catCenterY) / d * dt * 2.5;
    }
    // sometimes change direction randomly
    if (Math.random() < dt * 0.6) {
      randomDirection();
    }
  }

  // keep the direction length at 1 so the speed stays the same
  var length = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
  if (length === 0) {
    length = 1;
  }
  ball.vx = ball.vx / length;
  ball.vy = ball.vy / length;

  ball.x = ball.x + ball.vx * ballSpeed * dt;
  ball.y = ball.y + ball.vy * ballSpeed * dt;

  // bounce off the walls
  if (ball.x < 6) {
    ball.x = 6;
    ball.vx = Math.abs(ball.vx);
  }
  if (ball.x > WIDTH - 6) {
    ball.x = WIDTH - 6;
    ball.vx = -Math.abs(ball.vx);
  }
  if (ball.y < TOP + 6) {
    ball.y = TOP + 6;
    ball.vy = Math.abs(ball.vy);
  }
  if (ball.y > HEIGHT - 8) {
    ball.y = HEIGHT - 8;
    ball.vy = -Math.abs(ball.vy);
  }
}

function moveCat(dt) {
  var dx = 0;
  var dy = 0;

  // keyboard controls
  if (keys["arrowright"] || keys["d"]) { dx = dx + 1; }
  if (keys["arrowleft"] || keys["a"]) { dx = dx - 1; }
  if (keys["arrowdown"] || keys["s"]) { dy = dy + 1; }
  if (keys["arrowup"] || keys["w"]) { dy = dy - 1; }

  // mouse / touch controls: walk towards the pointer
  if (pointer !== null) {
    var px = pointer.x - (cat.x + 8);
    var py = pointer.y - (cat.y + 8);
    if (distance(0, 0, px, py) > 4) {
      dx = px;
      dy = py;
    }
  }

  var length = Math.sqrt(dx * dx + dy * dy);
  if (length > 0) {
    // make diagonal movement the same speed as normal movement
    dx = dx / length;
    dy = dy / length;

    cat.x = cat.x + dx * 105 * dt;
    cat.y = cat.y + dy * 105 * dt;

    if (dx > 0.1) { cat.dir = 1; }
    if (dx < -0.1) { cat.dir = -1; }

    walkFrame = walkFrame + dt * 10;
  }

  // keep the cat inside the screen
  cat.x = Math.max(3, Math.min(WIDTH - 21, cat.x));
  cat.y = Math.max(TOP, Math.min(HEIGHT - 19, cat.y));
}

function checkCatch() {
  // check if the ball touches the cat's head or body
  var headDist = distance(ball.x, ball.y, cat.x + 8 + cat.dir * 7, cat.y + 6);
  var bodyDist = distance(ball.x, ball.y, cat.x + 8 - cat.dir, cat.y + 10);

  if (headDist < 12 || bodyDist < 12) {
    score = score + 1;
    timeLeft = Math.min(30, timeLeft + 1.5);
    ballSpeed = Math.min(200, ballSpeed + 6);
    makeSparks(ball.x, ball.y);
    playBeep(660 + Math.min(score, 20) * 20, 0.08);
    placeBall();
    randomDirection();
  }
}

function updateGame(dt) {
  moveCat(dt);
  checkCatch();

  timeLeft = timeLeft - dt;
  if (timeLeft <= 0) {
    timeLeft = 0;
    gameState = "over";
    if (score > highScore) {
      highScore = score;
      try {
        localStorage.setItem("catchase_hi", highScore);
      } catch (err) {
        // ignore if saving is not allowed
      }
    }
    playBeep(180, 0.4, "sawtooth");
  }
}

function updateParticles(dt) {
  for (var i = 0; i < particles.length; i++) {
    particles[i].x = particles[i].x + particles[i].vx * dt;
    particles[i].y = particles[i].y + particles[i].vy * dt;
    particles[i].life = particles[i].life - dt;
  }
  // remove the dead particles (loop backwards so removing is safe)
  for (var j = particles.length - 1; j >= 0; j--) {
    if (particles[j].life <= 0) {
      particles.splice(j, 1);
    }
  }
}

// ===== DRAWING FUNCTIONS =====
// draws text with a black shadow so it is easy to read
function drawText(text, x, y, color, size, center) {
  ctx.font = "bold " + size + "px 'Courier New', monospace";
  ctx.textAlign = center ? "center" : "left";
  ctx.textBaseline = "top";
  ctx.fillStyle = "#000000";
  ctx.fillText(text, x + 1, y + 1);
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

function drawFloor() {
  // checkerboard of two greens, each tile is 16x16
  for (var y = 0; y < HEIGHT; y += 16) {
    for (var x = 0; x < WIDTH; x += 16) {
      if (((x + y) / 16) % 2 === 1) {
        ctx.fillStyle = "#38b764";
      } else {
        ctx.fillStyle = "#41a65c";
      }
      ctx.fillRect(x, y, 16, 16);
    }
  }
}

function drawBall() {
  var x = Math.round(ball.x);
  var y = Math.round(ball.y);

  ctx.fillStyle = "rgba(0,0,0,.25)";   // shadow
  ctx.fillRect(x - 4, y + 5, 8, 2);

  ctx.fillStyle = "#b13e53";           // dark red outline
  ctx.fillRect(x - 4, y - 5, 8, 10);
  ctx.fillRect(x - 5, y - 4, 10, 8);

  ctx.fillStyle = "#ef476f";           // light red middle
  ctx.fillRect(x - 4, y - 4, 7, 7);

  ctx.fillStyle = "#ffffff";           // shiny spot
  ctx.fillRect(x - 3, y - 3, 2, 2);
}

function drawCat() {
  var step = Math.floor(walkFrame) % 2;   // switches between 0 and 1 for walking

  ctx.save();
  ctx.translate(Math.round(cat.x + 8), Math.round(cat.y));
  ctx.scale(cat.dir, 1);                  // flips the cat when facing left

  ctx.fillStyle = "rgba(0,0,0,.25)";      // shadow
  ctx.fillRect(-8, 16, 18, 2);

  ctx.fillStyle = "#ef7d57";              // orange fur
  ctx.fillRect(-6, 14, 3, 2 + step);      // back leg
  ctx.fillRect(2, 14, 3, 3 - step);       // front leg
  ctx.fillRect(-8, 6, 14, 8);             // body
  ctx.fillRect(-11, 3 + step, 3, 7);      // tail
  ctx.fillRect(2, 2, 10, 9);              // head
  ctx.fillRect(2, 0, 3, 3);               // left ear
  ctx.fillRect(9, 0, 3, 3);               // right ear

  ctx.fillStyle = "#b13e53";              // stripes
  ctx.fillRect(-5, 6, 2, 4);
  ctx.fillRect(-1, 6, 2, 4);
  ctx.fillRect(-11, 3 + step, 3, 2);

  ctx.fillStyle = "#ffffff";              // eye
  ctx.fillRect(8, 4, 3, 3);
  ctx.fillStyle = "#000000";
  ctx.fillRect(9, 5, 2, 2);

  ctx.fillStyle = "#ff77a8";              // nose
  ctx.fillRect(11, 8, 2, 2);

  ctx.restore();
}

function drawParticles() {
  ctx.fillStyle = "#ffcd75";
  for (var i = 0; i < particles.length; i++) {
    ctx.fillRect(Math.round(particles[i].x), Math.round(particles[i].y), 2, 2);
  }
}

function drawScoreBar() {
  ctx.fillStyle = "#1a1c2c";
  ctx.fillRect(0, 0, WIDTH, TOP);

  drawText("SCORE " + score, 6, 3, "#ffcd75", 10, false);

  // the timer flashes red when time is almost out
  var timeColor = "#ffffff";
  if (timeLeft < 6 && Math.floor(timeLeft * 4) % 2 === 1) {
    timeColor = "#ef476f";
  }
  drawText("TIME " + Math.ceil(timeLeft), WIDTH / 2, 3, timeColor, 10, true);

  drawText("HI " + highScore, WIDTH - 60, 3, "#73eff7", 10, false);
}

function drawTitleScreen() {
  ctx.fillStyle = "rgba(26,28,44,.8)";
  ctx.fillRect(30, 50, WIDTH - 60, 140);
  drawText("CAT CHASE", WIDTH / 2, 62, "#ffcd75", 26, true);
  drawText("CATCH THE BALL!", WIDTH / 2, 104, "#ffffff", 11, true);
  drawText("ARROWS / WASD / TOUCH TO MOVE", WIDTH / 2, 126, "#73eff7", 9, true);
  if (Math.floor(blink * 2) % 2 === 1) {
    drawText("PRESS SPACE OR TAP TO START", WIDTH / 2, 156, "#a7f070", 10, true);
  }
}

function drawGameOverScreen() {
  ctx.fillStyle = "rgba(26,28,44,.85)";
  ctx.fillRect(40, 60, WIDTH - 80, 120);
  drawText("TIME UP!", WIDTH / 2, 72, "#ef476f", 24, true);
  drawText("SCORE " + score, WIDTH / 2, 108, "#ffffff", 14, true);

  if (score >= highScore && score > 0) {
    drawText("NEW HIGH SCORE!", WIDTH / 2, 128, "#ffcd75", 10, true);
  } else {
    drawText("BEST " + highScore, WIDTH / 2, 128, "#ffcd75", 10, true);
  }
  if (Math.floor(blink * 2) % 2 === 1) {
    drawText("SPACE OR TAP TO PLAY AGAIN", WIDTH / 2, 152, "#a7f070", 10, true);
  }
}

function drawGame() {
  drawFloor();
  drawBall();
  drawCat();
  drawParticles();
  drawScoreBar();

  if (gameState === "title") {
    drawTitleScreen();
  }
  if (gameState === "over") {
    drawGameOverScreen();
  }
}

// ===== MAIN GAME LOOP =====
var lastTime = 0;

function gameLoop(now) {
  // dt = seconds since the last frame (capped so the game doesn't jump)
  var dt = (now - lastTime) / 1000;
  if (!(dt > 0)) { dt = 0; }
  if (dt > 0.05) { dt = 0.05; }
  lastTime = now;

  blink = blink + dt;

  moveBall(dt);
  if (gameState === "play") {
    updateGame(dt);
  }
  updateParticles(dt);
  drawGame();

  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
